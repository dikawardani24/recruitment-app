name: ai_ats
description: "AI-powered applicant ranking — describe a job, upload CVs, get ranked candidates with reasoning."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  file_picker: ^11.0.3
  flutter_markdown: ^0.7.0
  hooks_riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2
  flutter_hooks: ^0.21.3+1
  go_router: ^17.4.0
  fl_chart: ^1.2.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  chucker_flutter: ^1.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.0.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
